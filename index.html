<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote of the day</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://sets.hugeicons.com/YOUR-SET-ID.css" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body>
    <div class="main flex flex-col">
        <div class="quote-icon">
            <iconify-icon icon="boxicons:quote-right-alt-filled" class=""></iconify-icon>
        </div>

        <div class="flex flex-col px-12 max-w-[50%] text-bold text-center gap-4">
            <h2 class="quote-text"></h2>
            <span class="author"></span>
            <button class="new-quote btn" onclick="getNewQuote()">New Quote</button>
        </div>

        <div class="quote-icon">
            <iconify-icon icon="boxicons:quote-left-alt-filled" class=""></iconify-icon>
        </div>
    </div>
</body>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/js/main.js"></script>

</html>
